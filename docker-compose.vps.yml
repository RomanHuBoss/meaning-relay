services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meaning_relay
      POSTGRES_USER: meaning_relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - meaning-relay-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meaning_relay -d meaning_relay"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://meaning_relay:${POSTGRES_PASSWORD}@db:5432/meaning_relay
      DATABASE_SSL: disable
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SID_PEPPER: ${SID_PEPPER:?SID_PEPPER is required}
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY is required}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      CLAIM_TOKEN_ENCRYPTION_KEY: ${CLAIM_TOKEN_ENCRYPTION_KEY:?CLAIM_TOKEN_ENCRYPTION_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      PRIVACY_OPERATOR_NAME: ${PRIVACY_OPERATOR_NAME:-Meaning Relay}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:?PRIVACY_CONTACT_EMAIL is required}
      MODERATION_CONTACT_EMAIL: ${MODERATION_CONTACT_EMAIL:?MODERATION_CONTACT_EMAIL is required}
      MAP_ENABLED: ${MAP_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/seed.mjs && node scripts/seed-starter-phrases.mjs && node server.js"]

  maintenance:
    build: .
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      MAINTENANCE_URL: http://app:3000/api/v1/internal/maintenance
      MAINTENANCE_TIMEOUT_MS: ${MAINTENANCE_TIMEOUT_MS:-15000}
    depends_on:
      app:
        condition: service_healthy
    command: ["sh", "-c", "while true; do node scripts/maintenance.mjs; sleep 60; done"]

volumes:
  meaning-relay-db:
