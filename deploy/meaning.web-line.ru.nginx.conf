server {
    server_name meaning.web-line.ru www.meaning.web-line.ru;
    listen 82.146.54.115:80;
    return 301 https://$host$request_uri;
}

server {
    server_name meaning.web-line.ru www.meaning.web-line.ru;
    listen 82.146.54.115:443 ssl;

    ssl_certificate "/var/www/httpd-cert/www-root/meaning.web-line.ru_le1.crt";
    ssl_certificate_key "/var/www/httpd-cert/www-root/meaning.web-line.ru_le1.key";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/ssl/certs/dhparam4096.pem;

    charset off;
    include /etc/nginx/vhosts-includes/*.conf;
    include /etc/nginx/vhosts-resources/meaning.web-line.ru/*.conf;
    include /etc/nginx/users-resources/www-root/*.conf;
    set $root_path /var/www/www-root/data/www/meaning.web-line.ru;
    root $root_path;
    access_log /var/www/httpd-logs/meaning.web-line.ru.access.log;
    error_log /var/www/httpd-logs/meaning.web-line.ru.error.log notice;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 65s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
